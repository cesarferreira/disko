[workspace]
members = [".", "crates/disko-core", "crates/disko-render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/disko"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[package]
# `disko` is taken on crates.io by an abandoned 0.0.0 crate; the binary this
# installs is still called `disko`.
name = "disko-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Disk usage TUI that shows what is full and what is using it"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["disk", "tui", "du", "df", "storage"]
categories = ["command-line-utilities", "filesystem", "visualization"]

[lib]
name = "disko"
path = "src/lib.rs"

[[bin]]
name = "disko"
path = "src/main.rs"

[dependencies]
disko-core = { path = "crates/disko-core", version = "0.1.0" }
disko-render = { path = "crates/disko-render", version = "0.1.0" }
anyhow.workspace = true
serde.workspace = true
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
jiff = "0.2.35"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
